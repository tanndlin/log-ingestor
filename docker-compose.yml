services:
  db:
    image: postgres:18-alpine
    container_name: ingestor_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - ingestor-host-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d logs"]
      interval: 5s
      timeout: 5s
      retries: 5
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestor
    # `docker compose watch` (or `up --watch`): Rust is compiled, so any change
    # to the ingestor or a crate it depends on triggers an image rebuild.
    develop:
      watch:
        - action: rebuild
          path: ./ingestor
        - action: rebuild
          path: ./http_ingestor
        - action: rebuild
          path: ./protobuf_ingestor
        - action: rebuild
          path: ./tcp_ingestor
        - action: rebuild
          path: ./util
        - action: rebuild
          path: ./writer
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./Dockerfile

networks:
  ingestor-host-network:
    driver: bridge

volumes:
  pgdata:
