services:
  db:
    image: postgres:18-alpine
    container_name: ingestor_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: traces
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - ingestor-host-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d traces"]
      interval: 5s
      timeout: 5s
      retries: 5
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestor
    init: true
    ports:
      - "${TCP_PORT:-1337}:1337"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/traces
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ingestor-host-network
    # `docker compose watch` (or `up --watch`): Rust is compiled, so any change
    # to the ingestor or a crate it depends on triggers an image rebuild.
    develop:
      watch:
        - action: rebuild
          path: ./ingestor
        - action: rebuild
          path: ./http_ingestor
        - action: rebuild
          path: ./protobuf_ingestor
        - action: rebuild
          path: ./tcp_ingestor
        - action: rebuild
          path: ./util
        - action: rebuild
          path: ./writer
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./Dockerfile
  querier:
    build:
      context: .
      dockerfile: Dockerfile
      target: querier
    init: true
    ports:
      - "${QUERIER_PORT:-1336}:1336"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/traces
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ingestor-host-network
    # Same as above, for the querier and the crates it depends on.
    develop:
      watch:
        - action: rebuild
          path: ./querier
        - action: rebuild
          path: ./util
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./Dockerfile

  viewer:
    build:
      context: .
      dockerfile: Dockerfile
      target: viewer
    ports:
      - "${VIEWER_PORT:-8080}:80"
    depends_on:
      - querier
    networks:
      - ingestor-host-network
    develop:
      watch:
        - action: rebuild
          path: ./log-viewer
          ignore:
            - node_modules/
            - dist/

networks:
  ingestor-host-network:
    driver: bridge

volumes:
  pgdata:
