services:
  db:
    image: postgres:18-alpine
    container_name: ingestor_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - ingestor-host-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d logs"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ingestor-host-network:
    driver: bridge

volumes:
  pgdata:
