[package]
name = "querier"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
util = { version = "0.1.0", path = "../util" }

[lints]
workspace = true
