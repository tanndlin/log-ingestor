[workspace]
resolver = "3"
members = [
    "http_ingestor",
    "ingestor", "querier",
    "protobuf_ingestor", "tanlogs-client", "tcp_ingestor", "test-client", "util", "writer",
]

[workspace.lints.clippy]
cast_possible_truncation = "allow"
missing_errors_doc = "allow"

pedantic = { level = "warn", priority = -1 }
