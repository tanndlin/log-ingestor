default_job = "clippy"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true
env.RUST_BACKTRACE = "0"


[keybindings]
c = "job:clippy"
t = "job:test"
